<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Guía de medición de bíceps en solitario frente a espejo">
  <title>Bíceps — Modo Solo (Frente a espejo)</title>

  <!-- Technical frame & grid ticks -->
  <g stroke="#87847A" opacity="0.22" fill="none" stroke-width="1">
    <path d="M16 28 V16 H28 M292 16 H304 V28 M16 192 V204 H28 M292 204 H304 V192" />
    <line x1="138" y1="38" x2="138" y2="188" stroke-dasharray="3 5" />
    <path d="M24 72 H30 M24 114 H32 M24 156 H30" />
  </g>

  <!-- Mirror reference frame -->
  <g transform="translate(232, 36)">
    <rect x="0" y="0" width="66" height="122" rx="8" stroke="#87847A" stroke-opacity="0.38" fill="#87847A" fill-opacity="0.06" stroke-width="1.4" />
    <line x1="11" y1="18" x2="25" y2="6" stroke="#87847A" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round" />
    <path d="M18 66 Q33 56 44 68 L48 44" stroke="#6E6B63" stroke-opacity="0.58" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <line x1="31" y1="54" x2="31" y2="74" stroke="#D95D39" stroke-width="2.2" stroke-linecap="round" />
    <text x="33" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#87847A">Espejo frontal</text>
  </g>

  <text x="36" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#87847A">SOLO · PUNTO MEDIO ACROMION-CODO</text>

  <!-- Anatomical silhouette: Shoulder cap, Upper Arm (Biceps/Triceps), 90° Forearm -->
  <g stroke="#6E6B63" stroke-width="2.2" fill="#87847A" fill-opacity="0.10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54 92 C60 68 80 58 98 66 C114 74 124 76 140 72 C154 68 168 74 176 86 L192 54 C196 46 208 48 206 58 L194 114 C190 128 178 134 162 134 C140 136 116 134 96 128 L88 178 L52 178 Z" />
  </g>

  <!-- Midpoint caliper bracket between shoulder acromion (92) and elbow (184) -->
  <g stroke="#87847A" opacity="0.5" stroke-width="1.1" fill="none">
    <line x1="92" y1="54" x2="184" y2="54" stroke-dasharray="2 3" />
    <circle cx="92" cy="54" r="2" fill="#87847A" />
    <circle cx="184" cy="54" r="2" fill="#87847A" />
    <line x1="138" y1="49" x2="138" y2="59" />
  </g>

  <!-- Measuring tape back-loop behind upper arm -->
  <path d="M136 72 C128 90 128 118 136 135" stroke="#D95D39" stroke-width="3.2" stroke-dasharray="5 4" opacity="0.55" fill="none" />

  <!-- Measuring tape front-loop over biceps peak -->
  <path d="M138 71 C148 90 148 118 138 136" stroke="#D95D39" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Zero-mark dot on top of arm -->
  <circle cx="143" cy="103" r="4.2" fill="#D95D39" />
  <circle cx="143" cy="103" r="7.5" stroke="#D95D39" stroke-width="1.2" opacity="0.4" fill="none" />

  <!-- Callout labels -->
  <text x="36" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#87847A">Mano libre rodea mitad del brazo · Usa siempre el mismo brazo</text>
</svg>
