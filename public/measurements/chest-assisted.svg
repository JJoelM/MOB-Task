    <path d="M112 44 L112 60 C90 66 66 74 60 96 L58 176 L80 176 L84 106 C86 132 90 156 92 180 L168 180 C170 156 174 132 176 106 L180 176 L202 176 L200 96 C194 74 170 66 148 60 L148 44 Z" />
