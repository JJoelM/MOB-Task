<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Guía de medición de pecho en solitario frente a espejo">
  <title>Pecho / Torso — Modo Solo (Frente a espejo)</title>

  <!-- Technical frame & grid ticks -->
  <g stroke="#87847A" opacity="0.22" fill="none" stroke-width="1">
    <path d="M16 28 V16 H28 M292 16 H304 V28 M16 192 V204 H28 M292 204 H304 V192" />
    <line x1="136" y1="24" x2="136" y2="194" stroke-dasharray="3 5" />
    <line x1="36" y1="112" x2="222" y2="112" stroke-dasharray="2 4" />
    <path d="M24 68 H30 M24 90 H28 M24 112 H32 M24 134 H28 M24 156 H30" />
  </g>

  <!-- Mirror reference frame -->
  <g transform="translate(232, 36)">
    <rect x="0" y="0" width="66" height="122" rx="8" stroke="#87847A" stroke-opacity="0.38" fill="#87847A" fill-opacity="0.06" stroke-width="1.4" />
    <line x1="11" y1="18" x2="25" y2="6" stroke="#87847A" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round" />
    <!-- Side chest/scapula level reflection -->
    <path d="M26 28 C25 48 24 72 28 94 M38 28 C46 46 47 64 42 94" stroke="#6E6B63" stroke-opacity="0.58" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <line x1="23" y1="54" x2="48" y2="54" stroke="#D95D39" stroke-width="2.2" stroke-linecap="round" />
    <text x="33" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#87847A">Espejo lateral</text>
  </g>

  <text x="36" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#87847A">SOLO · LÍNEA MEDIA ESTERNAL</text>

  <!-- Anatomical silhouette: Upper Torso, Axillae & Pectorals -->
  <g stroke="#6E6B63" stroke-width="2.2" fill="#87847A" fill-opacity="0.10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 44 L118 60 C96 66 72 74 66 96 L64 176 L86 176 L90 106 C92 132 96 156 98 180 L174 180 C176 156 180 132 182 106 L186 176 L208 176 L206 96 C200 74 176 66 154 60 L154 44 Z" />
  </g>

  <!-- Pectoral contour lines -->
  <g stroke="#6E6B63" stroke-opacity="0.42" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M96 108 C106 122 124 122 133 114" />
    <path d="M176 108 C166 122 148 122 139 114" />
  </g>

  <!-- Measuring tape back-loop under axillae / across scapulae -->
  <path d="M90 110 C108 100 164 100 182 110" stroke="#D95D39" stroke-width="3.2" stroke-dasharray="5 4" opacity="0.55" fill="none" />

  <!-- Measuring tape front-loop across mid-chest -->
  <path d="M89 112 C108 122 164 122 183 112" stroke="#D95D39" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Zero-mark dot at sternum -->
  <circle cx="136" cy="119" r="4.2" fill="#D95D39" />
  <circle cx="136" cy="119" r="7.5" stroke="#D95D39" stroke-width="1.2" opacity="0.4" fill="none" />

  <!-- Callout labels -->
  <text x="36" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#87847A">Mano libre al frente · Pasa bajo axilas, baja brazos y exhala suave</text>
</svg>
