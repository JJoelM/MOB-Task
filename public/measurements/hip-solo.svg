<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Guía de medición de cadera en solitario frente a espejo">
  <title>Cadera — Modo Solo (Frente a espejo)</title>

  <!-- Technical frame & grid ticks -->
  <g stroke="#87847A" opacity="0.22" fill="none" stroke-width="1">
    <path d="M16 28 V16 H28 M292 16 H304 V28 M16 192 V204 H28 M292 204 H304 V192" />
    <line x1="134" y1="24" x2="134" y2="194" stroke-dasharray="3 5" />
    <line x1="36" y1="126" x2="220" y2="126" stroke-dasharray="2 4" />
    <path d="M24 68 H30 M24 97 H28 M24 126 H32 M24 155 H28" />
  </g>

  <!-- Mirror reference frame showing gluteal max projection -->
  <g transform="translate(232, 36)">
    <rect x="0" y="0" width="66" height="122" rx="8" stroke="#87847A" stroke-opacity="0.38" fill="#87847A" fill-opacity="0.06" stroke-width="1.4" />
    <line x1="11" y1="18" x2="25" y2="6" stroke="#87847A" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round" />
    <!-- Side pelvis/glute curve in mirror -->
    <path d="M27 28 C27 52 26 76 28 96 M39 28 C38 48 51 64 51 74 C51 84 42 90 40 96" stroke="#6E6B63" stroke-opacity="0.6" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <line x1="25" y1="73" x2="53" y2="73" stroke="#D95D39" stroke-width="2.2" stroke-linecap="round" />
    <text x="33" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#87847A">Espejo lateral</text>
  </g>

  <text x="36" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#87847A">SOLO · PIES JUNTOS · ESPEJO LATERAL</text>

  <!-- Anatomical silhouette: Waist tapering into Pelvis / Glute-Hip widest contour & upper thighs -->
  <g stroke="#6E6B63" stroke-width="2.2" fill="#87847A" fill-opacity="0.10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 44 C100 66 96 80 86 98 C76 114 76 136 84 156 L90 182 L130 182 L134 152 L138 182 L178 182 L184 156 C192 136 192 114 182 98 C172 80 168 66 168 44 Z" />
  </g>

  <!-- Iliac crest subtle curves -->
  <g stroke="#6E6B63" stroke-opacity="0.4" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M98 92 Q112 104 122 108" />
    <path d="M170 92 Q156 104 146 108" />
  </g>

  <!-- Measuring tape back-loop across gluteal prominence -->
  <path d="M78 124 C98 114 170 114 190 124" stroke="#D95D39" stroke-width="3.2" stroke-dasharray="5 4" opacity="0.55" fill="none" />

  <!-- Measuring tape front-loop -->
  <path d="M77 126 C98 136 170 136 191 126" stroke="#D95D39" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Zero-mark dot at front -->
  <circle cx="134" cy="133" r="4.2" fill="#D95D39" />
  <circle cx="134" cy="133" r="7.5" stroke="#D95D39" stroke-width="1.2" opacity="0.4" fill="none" />

  <!-- Callout labels -->
  <text x="36" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#87847A">Mano libre al frente · Mayor proyección glútea en espejo</text>
</svg>
