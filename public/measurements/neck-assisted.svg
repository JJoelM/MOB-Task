<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Guía de medición de cuello con asistencia lateral">
  <title>Cuello — Con asistencia (Dúo / Amigo)</title>

  <!-- Technical frame & grid ticks -->
  <g stroke="#87847A" opacity="0.22" fill="none" stroke-width="1">
    <path d="M16 28 V16 H28 M292 16 H304 V28 M16 192 V204 H28 M292 204 H304 V192" />
    <line x1="138" y1="22" x2="138" y2="196" stroke-dasharray="3 5" />
    <path d="M24 70 H30 M24 92 H28 M24 114 H32 M24 136 H28 M24 158 H30" />
  </g>

  <!-- Top mode tag -->
  <text x="36" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2B7A57">ASISTIDO · HOMBROS SUELTOS</text>

  <!-- Anatomical silhouette: Jaw, Neck, Trapezius & Relaxed Shoulders -->
  <g stroke="#6E6B63" stroke-width="2.2" fill="#87847A" fill-opacity="0.10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M99 38 C101 62 115 76 138 78 C161 76 175 62 177 38" />
    <path d="M115 73 C117 94 116 116 109 132 C95 146 69 154 49 164 L49 182 L227 182 L227 164 C207 154 181 146 167 132 C160 116 159 94 161 73" />
  </g>

  <!-- Anatomical subtle details -->
  <g stroke="#6E6B63" stroke-opacity="0.45" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M134 99 Q138 103 142 99" />
    <path d="M89 152 Q115 156 132 162" />
    <path d="M187 152 Q161 156 144 162" />
  </g>

  <!-- Assistant lateral sightline & level check in MOB Sage (#2B7A57) -->
  <g stroke="#2B7A57" fill="none">
    <line x1="88" y1="114" x2="262" y2="114" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.75" />
    <!-- Eye-level indicator on right -->
    <path d="M268 114 C274 107 284 107 290 114 C284 121 274 121 268 114 Z" stroke-width="1.7" />
    <circle cx="279" cy="114" r="2.6" fill="#2B7A57" />
    <path d="M258 114 L248 110 M258 114 L248 118" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <text x="276" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#2B7A57">Asistente</text>
  <text x="276" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#2B7A57">Nivel ojos</text>

  <!-- Measuring tape back-loop -->
  <path d="M114 112 C125 104 151 104 162 112" stroke="#D95D39" stroke-width="3.2" stroke-dasharray="5 4" opacity="0.55" fill="none" />

  <!-- Measuring tape front-loop -->
  <path d="M113 113 C125 121 151 121 163 113" stroke="#D95D39" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Zero-mark lateral caliper dot (read from side by partner) -->
  <circle cx="162" cy="114" r="4.2" fill="#D95D39" />
  <circle cx="162" cy="114" r="7.5" stroke="#D95D39" stroke-width="1.2" opacity="0.4" fill="none" />

  <!-- Callout labels -->
  <text x="36" y="199" font-family="system-ui, sans-serif" font-size="11" fill="#87847A">Lectura lateral a nivel de ojos · Brazos relajados al costado</text>
</svg>
