<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Guía de medición de hombros en solitario frente a espejo">
  <title>Hombros — Modo Solo (Frente a espejo)</title>

  <!-- Technical frame & grid ticks -->
  <g stroke="#87847A" opacity="0.22" fill="none" stroke-width="1">
    <path d="M16 28 V16 H28 M292 16 H304 V28 M16 192 V204 H28 M292 204 H304 V192" />
    <line x1="134" y1="24" x2="134" y2="194" stroke-dasharray="3 5" />
    <line x1="36" y1="108" x2="224" y2="108" stroke-dasharray="2 4" />
  </g>

  <!-- Mirror frame indicator -->
  <g transform="translate(234, 36)">
    <rect x="0" y="0" width="64" height="120" rx="8" stroke="#87847A" stroke-opacity="0.38" fill="#87847A" fill-opacity="0.06" stroke-width="1.4" />
    <line x1="10" y1="18" x2="24" y2="6" stroke="#87847A" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round" />
    <path d="M16 66 C18 54 46 54 48 66 L46 94 M18 94 L16 66" stroke="#6E6B63" stroke-opacity="0.55" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <line x1="14" y1="68" x2="50" y2="68" stroke="#D95D39" stroke-width="2.2" stroke-linecap="round" />
    <text x="32" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#87847A">Espejo frontal</text>
  </g>

  <text x="36" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#87847A">SOLO · AJUSTAR Y BAJAR CODOS</text>

  <!-- Anatomical silhouette: Neck, Broad Deltoid Caps, Upper Chest & Arms -->
  <g stroke="#6E6B63" stroke-width="2.2" fill="#87847A" fill-opacity="0.10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M116 44 L116 64 C94 72 64 78 56 102 C52 116 54 146 58 178 L82 178 L86 128 L88 178 L180 178 L182 128 L186 178 L210 178 C214 146 216 116 212 102 C204 78 174 72 152 64 L152 44 Z" />
  </g>

  <!-- Clavicle & deltoid contour lines -->
  <g stroke="#6E6B63" stroke-opacity="0.42" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M90 82 Q114 88 130 92" />
    <path d="M178 82 Q154 88 138 92" />
  </g>

  <!-- Measuring tape back-loop around widest deltoids -->
  <path d="M55 106 C86 94 182 94 213 106" stroke="#D95D39" stroke-width="3.2" stroke-dasharray="5 4" opacity="0.55" fill="none" />

  <!-- Measuring tape front-loop across both deltoid peaks -->
  <path d="M54 108 C86 120 182 120 214 108" stroke="#D95D39" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Zero-mark dot at front sternum -->
  <circle cx="134" cy="117" r="4.2" fill="#D95D39" />
  <circle cx="134" cy="117" r="7.5" stroke="#D95D39" stroke-width="1.2" opacity="0.4" fill="none" />

  <!-- Callout labels -->
  <text x="36" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#87847A">Postura neutra · Rodea pico de deltoides y relaja hombros</text>
</svg>
