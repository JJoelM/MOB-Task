<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Guía de medición de muslo medio en solitario frente a espejo">
  <title>Muslo medio — Modo Solo (Frente a espejo)</title>

  <!-- Technical frame & grid ticks -->
  <g stroke="#87847A" opacity="0.22" fill="none" stroke-width="1">
    <path d="M16 28 V16 H28 M292 16 H304 V28 M16 192 V204 H28 M292 204 H304 V192" />
    <line x1="136" y1="24" x2="136" y2="194" stroke-dasharray="3 5" />
    <line x1="36" y1="116" x2="220" y2="116" stroke-dasharray="2 4" />
    <path d="M24 64 H30 M24 90 H28 M24 116 H32 M24 142 H28 M24 168 H30" />
  </g>

  <!-- Mirror reference frame -->
  <g transform="translate(232, 36)">
    <rect x="0" y="0" width="66" height="122" rx="8" stroke="#87847A" stroke-opacity="0.38" fill="#87847A" fill-opacity="0.06" stroke-width="1.4" />
    <line x1="11" y1="18" x2="25" y2="6" stroke="#87847A" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round" />
    <path d="M27 28 L30 96 M43 28 C46 54 44 76 40 96" stroke="#6E6B63" stroke-opacity="0.58" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <line x1="27" y1="62" x2="45" y2="62" stroke="#D95D39" stroke-width="2.2" stroke-linecap="round" />
    <text x="33" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#87847A">Espejo lateral</text>
  </g>

  <text x="36" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#87847A">SOLO · PESO REPARTIDO EN AMBOS PIES</text>

  <!-- Anatomical silhouette: Pelvis base, Right & Left Thighs down to Knees -->
  <g stroke="#6E6B63" stroke-width="2.2" fill="#87847A" fill-opacity="0.10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 46 L190 46 C194 74 190 112 182 152 L178 182 L144 182 L138 98 L130 182 L94 182 L88 152 C80 112 76 74 78 46 Z" />
  </g>

  <!-- Inguinal crease & patella landmarks on measured thigh (right side of figure) -->
  <g stroke="#6E6B63" stroke-opacity="0.42" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M140 62 Q162 72 184 68" />
    <path d="M150 168 Q161 173 172 168" />
  </g>

  <!-- Measuring tape back-loop around mid-thigh -->
  <path d="M140 114 C152 107 174 107 187 114" stroke="#D95D39" stroke-width="3.2" stroke-dasharray="5 4" opacity="0.55" fill="none" />

  <!-- Measuring tape front-loop -->
  <path d="M139 116 C152 123 174 123 188 116" stroke="#D95D39" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Zero-mark dot at anterior thigh -->
  <circle cx="163" cy="121" r="4.2" fill="#D95D39" />
  <circle cx="163" cy="121" r="7.5" stroke="#D95D39" stroke-width="1.2" opacity="0.4" fill="none" />

  <!-- Callout labels -->
  <text x="36" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#87847A">Postura neutra · Mitad entre pliegue inguinal y rótula</text>
</svg>
