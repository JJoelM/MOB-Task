    <path d="M16 28 V16 H28 M292 16 H304 V28 M16 192 V204 H28 M292 204 H304 V192" />
    <line x1="132" y1="24" x2="132" y2="194" stroke-dasharray="3 5" />
    <path d="M24 66 H30 M24 92 H28 M24 118 H32 M24 144 H28 M24 170 H30" />
  </g>

  <text x="36" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2B7A57">ASISTIDO · CINTA PARALELA AL PISO</text>

  <!-- Anatomical silhouette: Torso & Relaxed Arms slightly parted -->
  <g stroke="#6E6B63" stroke-width="2.2" fill="#87847A" fill-opacity="0.10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 44 C84 70 94 94 96 118 C94 138 82 156 78 180 L186 180 C182 156 170 138 168 118 C170 94 180 70 182 44 Z" />
  </g>

  <g stroke="#6E6B63" stroke-opacity="0.42" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M106 84 Q132 70 158 84" />
    <circle cx="132" cy="118" r="2" fill="#6E6B63" />
  </g>

  <!-- Assistant lateral level check (#2B7A57) -->
  <g stroke="#2B7A57" fill="none">
    <line x1="72" y1="118" x2="260" y2="118" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.75" />
    <path d="M266 118 C272 111 282 111 288 118 C282 125 272 125 266 118 Z" stroke-width="1.7" />
    <circle cx="277" cy="118" r="2.6" fill="#2B7A57" />
    <path d="M256 118 L246 114 M256 118 L246 122" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <text x="275" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#2B7A57">Asistente</text>
  <text x="275" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#2B7A57">Al costado</text>

  <!-- Measuring tape back-loop -->
  <path d="M96 116 C110 107 154 107 168 116" stroke="#D95D39" stroke-width="3.2" stroke-dasharray="5 4" opacity="0.55" fill="none" />

  <!-- Measuring tape front-loop -->
