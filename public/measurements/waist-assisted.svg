  <!-- Zero-mark lateral dot -->
  <circle cx="168" cy="118" r="4.2" fill="#D95D39" />
  <circle cx="168" cy="118" r="7.5" stroke="#D95D39" stroke-width="1.2" opacity="0.4" fill="none" />

  <!-- Callout labels -->
  <text x="36" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#87847A">Lectura lateral a nivel de ojos · Brazos relajados · Asistente al costado</text>
