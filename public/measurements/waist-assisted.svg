<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Guía de medición de cintura con asistencia lateral">
  <title>Cintura — Con asistencia (Dúo / Amigo)</title>

  <!-- Technical frame & grid ticks -->
